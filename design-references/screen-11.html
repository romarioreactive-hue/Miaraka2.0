<script>
        function switchTab(tab) {
            const receivedTab = document.getElementById('tab-received');
            const sentTab = document.getElementById('tab-sent');
            const indicator = document.getElementById('tab-indicator');

            if (tab === 'received') {
                receivedTab.classList.remove('text-outline');
                receivedTab.classList.add('text-primary');
                sentTab.classList.remove('text-primary');
                sentTab.classList.add('text-outline');
                indicator.style.left = '0%';
            } else {
                sentTab.classList.remove('text-outline');
                sentTab.classList.add('text-primary');
                receivedTab.classList.remove('text-primary');
                receivedTab.classList.add('text-outline');
                indicator.style.left = '50%';
            }
        }

        // Simple button interaction feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 100);
            });
        });
    </script>
