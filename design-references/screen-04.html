<!-- Navigation Shell Logic (Suppressed for Onboarding as per instructions) -->
<script>
        // Micro-interactions and subtle glow movement
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.glass-card, .glow-blue');
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const cardX = rect.left + rect.width / 2;
                const cardY = rect.top + rect.height / 2;

                const angleX = (cardY - mouseY) / 30;
                const angleY = (mouseX - cardX) / 30;

                card.style.transform = `perspective(1000px) rotateX(${angleX}deg) rotateY(${angleY}deg)`;
            });
        });

        document.addEventListener('mouseleave', () => {
            const cards = document.querySelectorAll('.glass-card, .glow-blue');
            cards.forEach(card => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            });
        });
    </script>
