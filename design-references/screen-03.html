<style>
        :root {
            --primary: #afc6ff;
            --surface: #071424;
            --on-surface: #d7e3fa;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #071424;
            color: #d7e3fa;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .glass-card {
            background: rgba(12, 33, 71, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bioluminescent-glow {
            box-shadow: 0 0 20px rgba(79, 140, 255, 0.15);
        }
        .gradient-text {
            background: linear-gradient(90deg, #3ee09d 0%, #afc6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pulse-animation {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .route-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 4s linear forwards;
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
    </style>

<body class="flex flex-col h-screen w-screen overflow-hidden">
<!-- Hero Map Visualization (Edge-to-edge) -->
<div class="relative flex-grow w-full overflow-hidden">
<!-- Interactive Map Mockup -->
<div class="absolute inset-0 z-0 bg-[#06142B]" data-location="Paris" style="">
<div class="absolute inset-0 opacity-40 bg-[radial-gradient(circle_at_center,_transparent_0%,_#06142B_100%)]"></div>
<!-- Map Visualization Placeholder -->

<!-- Animated Route Overlay -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 400 800">
<path class="route-path" d="M100,600 Q150,550 200,500 T300,400" fill="none" filter="drop-shadow(0 0 8px #38D6E8)" stroke="#38D6E8" stroke-linecap="round" stroke-width="4"></path>
<!-- Destination Marker -->
<circle class="pulse-animation" cx="300" cy="400" fill="#29D391" r="6"></circle>
<circle class="animate-ping opacity-75" cx="300" cy="400" fill="none" r="12" stroke="#29D391" stroke-width="2"></circle>
<!-- Origin Marker -->
<circle class="bioluminescent-glow" cx="100" cy="600" fill="#4F8CFF" r="8"></circle>
</svg>
<!-- ETA Badge Overlay -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 glass-card px-sm py-xs rounded-full flex items-center gap-xs bioluminescent-glow animate-bounce">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-label-md text-label-md text-on-surface">ETA 15 min</span>
</div>
</div>
</div>
<!-- Top Controls (Skip) -->
<div class="absolute top-0 left-0 w-full px-margin-mobile pt-lg flex justify-end z-10">
<button class="text-on-surface-variant font-label-md text-label-md hover:text-on-surface transition-colors">Passer</button>
</div>
</div>
<!-- Content Panel -->
<div class="relative z-20 flex flex-col px-margin-mobile pb-xl pt-lg glass-card rounded-t-lg border-t border-surface-container-high -mt-10">
<!-- Progress Bar -->
<div class="flex gap-xs mb-lg justify-center"><div class="w-1.5 h-1.5 rounded-full bg-surface-container-highest"></div><div class="w-8 h-1.5 rounded-full brand-gradient-bg shadow-[0_0_8px_rgba(79,140,255,0.4)]"></div><div class="w-1.5 h-1.5 rounded-full bg-surface-container-highest"></div></div>
<!-- Text Content -->
<div class="space-y-sm text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight">
                Voyez les déplacements autorisés <span class="gradient-text">en temps réel.</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
                Une carte claire, la dernière position connue et le temps d’arrivée estimé.
            </p>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-sm"><button class="w-full h-touch-target rounded-full brand-gradient-bg text-white font-label-md text-label-md shadow-lg shadow-primary/20 active:scale-95 transition-transform duration-200">Continuer</button><button class="w-full h-touch-target rounded-full bg-transparent border border-outline-variant/30 text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-low transition-colors active:scale-95 duration-200">Retour</button></div>
<!-- Bottom Safe Area Spacer -->
<div class="h-4"></div>
</div>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-background to-transparent opacity-60"></div>
</div>
<script>
        // Simple Interaction logic for feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Haptic feedback simulation
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });

        // Dynamic Map Elements Entry Animation
        window.addEventListener('DOMContentLoaded', () => {
            const path = document.querySelector('.route-path');
            if (path) {
                path.style.opacity = '0';
                setTimeout(() => {
                    path.style.opacity = '1';
                }, 500);
            }
        });
    </script>
</body></html>
