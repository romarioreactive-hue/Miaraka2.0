<style>
        body {
            background-color: #071424;
            color: #d7e3fa;
            overflow-x: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .mic-pulse {
            animation: pulse-ring 2.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(.8); opacity: 0.5; }
            50% { opacity: 0.2; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .waveform-bar {
            animation: waveform 1.2s ease-in-out infinite alternate;
        }

        @keyframes waveform {
            0% { height: 12px; }
            100% { height: 48px; }
        }

        .glass-card {
            background: rgba(12, 33, 71, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bioluminescent-glow {
            box-shadow: 0 0 30px rgba(79, 140, 255, 0.25);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #3ee09d, #4F8CFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>

<body class="flex flex-col min-h-screen">
<!-- Header Suppression: Following Shell Visibility Rule for Transactional/Onboarding -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-xl pb-32 relative overflow-hidden">
<!-- Background Ambient Elements -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute top-1/4 -right-20 w-80 h-80 bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-secondary/10 rounded-full blur-[120px]"></div>
</div>
<!-- Progress Indicator -->
<div class="flex gap-2 mb-lg">
<div class="w-8 h-1 rounded-full bg-surface-container-highest"></div>
<div class="w-8 h-1 rounded-full bg-surface-container-highest"></div>
<div class="w-8 h-1 rounded-full bg-surface-container-highest"></div>
<div class="w-12 h-1 rounded-full bg-primary shadow-[0_0_8px_#afc6ff]"></div>
</div>
<!-- Main Content Canvas -->
<div class="w-full max-w-md text-center flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-sm">
                Demandez simplement à <span class="gradient-text">MIA.</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-4 mb-xl">
                Où est Rica ? Qui est au bureau ?<br/>Qui est premier du défi ?
            </p>
<!-- MIA Visual Interaction Area -->
<div class="relative w-full aspect-square flex flex-center items-center justify-center mb-xl">
<!-- Animated Waves -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="mic-pulse absolute w-48 h-48 rounded-full border-2 border-primary/30"></div>
<div class="mic-pulse absolute w-48 h-48 rounded-full border-2 border-secondary/20" style="animation-delay: 0.8s;"></div>
<div class="mic-pulse absolute w-48 h-48 rounded-full border-2 border-primary/10" style="animation-delay: 1.6s;"></div>
</div>
<!-- Speech Bubble Response (Glassmorphism) -->
<div class="absolute -top-4 right-0 md:-right-8 glass-card rounded-lg p-sm max-w-[200px] shadow-2xl z-20 animate-bounce" style="animation-duration: 3s;">
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-secondary text-[20px]" data-icon="auto_awesome">auto_awesome</span>
<p class="font-label-sm text-label-sm text-on-surface leading-tight text-left">
                            Rica est près de <span class="font-bold">Jumbo Score Ankorondrano</span>. Position mise à jour il y a 20 secondes.
                        </p>
</div>
<!-- Bubble Tail -->
<div class="absolute bottom-[-10px] left-10 w-0 h-0 border-l-[10px] border-l-transparent border-t-[10px] border-t-[rgba(12,33,71,0.6)] border-r-[10px] border-r-transparent"></div>
</div>
<!-- Large Microphone Button -->
<div class="relative z-10 w-32 h-32 rounded-full bg-gradient-to-br from-secondary-container to-primary-container p-[2px] bioluminescent-glow hover:scale-105 transition-transform duration-500 cursor-pointer">
<div class="w-full h-full rounded-full bg-[#071424] flex flex-col items-center justify-center overflow-hidden">
<!-- Animated Waveform -->
<div class="flex items-end gap-1 mb-2 h-12">
<div class="waveform-bar w-1.5 bg-secondary rounded-full" style="animation-delay: 0.1s; height: 20px;"></div>
<div class="waveform-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.3s; height: 40px;"></div>
<div class="waveform-bar w-1.5 bg-tertiary rounded-full" style="animation-delay: 0.5s; height: 32px;"></div>
<div class="waveform-bar w-1.5 bg-secondary rounded-full" style="animation-delay: 0.2s; height: 48px;"></div>
<div class="waveform-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.4s; height: 24px;"></div>
</div>
<span class="material-symbols-outlined text-on-background text-[32px]" data-icon="mic" data-weight="fill">mic</span>
</div>
</div>
<!-- Floating Avatar (Rica Context) -->
<div class="absolute bottom-10 left-10 w-16 h-16 rounded-full border-2 border-primary-container overflow-hidden shadow-lg transform -rotate-12">
<img class="w-full h-full object-cover" data-alt="A close-up portrait of a cheerful young woman with curly dark hair, wearing a stylish dark blue outdoor jacket. The background is a soft-focus urban park in Antananarivo during twilight, with warm golden lights beginning to glow. The photography is clean, high-end, with a vibrant yet professional aesthetic that matches a secure social app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFqcbzQyQrvtQvoKMlkAtcwsy5JzoqVh3A3mnT1TWUKuiQUHLX-G8VwP495IrQTNvWNROPRV394kTkWwwBP5LdwXNcKXsPFuHzUffQJeX5u_Yx_uqKI4gmCqpRySuEgHOuv5e49oR-xGyY9HDjUguF3eu_f3AjlFKXqALwLb9buLVvWDcMi7raZUbJfvALCwzJNL9je_64hJ0S30gWzkIy7yaHr5e2z2vuJFnYhO0bUjCFiNBvinGBBw"/>
</div>
</div>
</div>
</main>
<!-- Bottom Actions Cluster -->
<footer class="fixed bottom-0 left-0 w-full px-margin-mobile pb-12 pt-6 bg-gradient-to-t from-background to-transparent">
<div class="max-w-md mx-auto flex flex-col gap-4">
<!-- Primary Action -->
<button class="w-full h-touch-target rounded-full bg-gradient-to-r from-tertiary to-primary-container text-on-primary-container font-label-md text-label-md flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                Continuer
            </button>
<!-- Secondary Actions -->
<div class="flex items-center justify-between px-2">
<button class="text-outline font-label-md text-label-md hover:text-on-background transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                    Retour
                </button>
<button class="text-outline font-label-md text-label-md hover:text-on-background transition-colors">
                    Passer
                </button>
</div>
</div>
</footer>
<script>
        // Micro-interaction for the mic button
        const micButton = document.querySelector('.bioluminescent-glow');
        micButton.addEventListener('mousedown', () => {
            micButton.style.transform = 'scale(0.92)';
        });
        micButton.addEventListener('mouseup', () => {
            micButton.style.transform = 'scale(1.05)';
        });

        // Simulate waveform jitter for extra "life"
        const bars = document.querySelectorAll('.waveform-bar');
        setInterval(() => {
            bars.forEach(bar => {
                const randomHeight = Math.floor(Math.random() * 30) + 15;
                bar.style.height = randomHeight + 'px';
            });
        }, 150);
    </script>
</body></html>
