<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); filter: blur(40px); }
            50% { opacity: 1; transform: scale(1.1); filter: blur(60px); }
        }

        @keyframes content-fade-in {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }

        .animate-fade-up {
            animation: content-fade-in 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .brand-gradient-text {
            background: linear-gradient(to right, #3ee09d, #38D6E8, #4F8CFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-gradient-bg {
            background: linear-gradient(135deg, #3ee09d, #4F8CFF);
        }

        body {
            background-color: #06142B;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>

<body class="bg-[#06142B] flex flex-col items-center justify-center relative overflow-hidden">

<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center text-center px-margin-mobile">
<!-- Premium Logo Component -->

<div class="relative mb-lg">
<!-- Outer Glow -->

<!-- Logo Container -->

<span class="material-symbols-outlined text-surface text-2xl md:text-3xl" style="font-variation-settings: 'FILL' 1;">

<span class="material-symbols-outlined text-surface text-2xl md:text-3xl" style="font-variation-settings: 'FILL' 1;">
                                person

</div>
</div>
</div>

<div class="fixed bottom-24 w-48 h-[2px] bg-surface-container-highest rounded-full overflow-hidden opacity-0 animate-fade-up" style="animation-delay: 1s;">

</div>
<!-- Loading Text -->
<div class="fixed bottom-16 opacity-0 animate-fade-up" style="animation-delay: 1.2s;">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Sécurisation de la connexion...</span>
</div>

<!-- Interactive Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            
            // Simulate loading transition
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 500);

            // Optional: Auto-redirect logic or transition to main app would go here
            // setTimeout(() => {
            //    window.location.href = '/dashboard';
            // }, 4000);
        });

        // Add subtle mouse parallax for depth
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            
            const glows = document.querySelectorAll('.animate-pulse-glow');
            glows.forEach((glow, index) => {
                const factor = (index + 1) * 0.5;
                glow.style.transform = `translate(${moveX * factor}px, ${moveY * factor}px)`;
            });
        });
    </script>
